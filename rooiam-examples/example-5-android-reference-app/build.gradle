plugins {
    id 'com.android.application' version '8.10.1'
    id 'com.android.library' version '8.10.1' apply false
}
android {
    namespace 'com.rooiam.mobile'
    compileSdk 36
    defaultConfig {
        // Keep existing debug enrollments; Play certification uses a separate app.
        applicationId providers.gradleProperty('rooiamApplicationId').getOrElse('com.rooiam.mobile')
        minSdk 26; targetSdk 36; versionCode 8; versionName '0.4.0-alpha.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def uploadStore = System.getenv('ROOIAM_ANDROID_KEYSTORE_PATH')
    if (uploadStore) {
        ['ROOIAM_ANDROID_STORE_PASSWORD', 'ROOIAM_ANDROID_KEY_ALIAS', 'ROOIAM_ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing release signing environment variable: ${it}")
        }
        signingConfigs {
            playUpload {
                storeFile file(uploadStore)
                storePassword System.getenv('ROOIAM_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ROOIAM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ROOIAM_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.playUpload } }
    }
}
dependencies {
    implementation project(':sdk')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.android.play:integrity:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
