    environment:
      ROOIAM_GOOGLE_PLAY_USE_ADC: ${ROOIAM_GOOGLE_PLAY_USE_ADC:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
