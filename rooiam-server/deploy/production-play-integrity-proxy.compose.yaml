# Combine with the active production Compose file only after deploying and testing
# the Cloud Run decoder. Keep the secret in the host's private .env, outside Git.
services:
  server:
    environment:
      # Persist a strong private HS256 key across container replacements. Without
      # this, the server falls back to a predictable development key.
      ROOIAM_OIDC_SIGNING_SECRET: ${ROOIAM_OIDC_SIGNING_SECRET:?Set a private persistent OIDC signing secret}
      ROOIAM_GOOGLE_PLAY_DECODE_PROXY_URL: ${ROOIAM_GOOGLE_PLAY_DECODE_PROXY_URL:?Set the Cloud Run HTTPS origin}
      ROOIAM_GOOGLE_PLAY_DECODE_PROXY_SECRET_PATH: /run/secrets/rooiam-play-proxy
    volumes:
      - ${ROOIAM_PLAY_PROXY_SECRET_FILE:?Set the private host secret file path}:/run/secrets/rooiam-play-proxy:ro
