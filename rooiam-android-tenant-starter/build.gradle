plugins {
    id 'com.android.application' version '8.10.1'
    id 'com.android.library' version '8.10.1' apply false
}

def tenantFile = file('tenant.properties')
if (!tenantFile.isFile()) throw new GradleException('Create tenant.properties from the checked-in starter file.')
def tenant = new Properties()
tenantFile.withInputStream { tenant.load(it) }
def value = { key -> (tenant.getProperty(key) ?: '').trim() }
def appId = value('applicationId')
def appName = value('appName')
def apiOrigin = value('apiOrigin')
def cloudProjectNumber = value('cloudProjectNumber')
def brandColor = value('brandColor')
def cornerRadius = value('cornerRadiusDp')
def versionCodeValue = value('versionCode')
def versionNameValue = value('versionName')
def logoName = value('logoFile')

if (!(appId ==~ /[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+/))
    throw new GradleException('tenant.properties: applicationId must be a dotted Android package name.')
if (!appName || appName.length() > 50 || appName.contains('<') || appName.contains('&'))
    throw new GradleException('tenant.properties: appName must be 1-50 characters without XML markup.')
if (!(apiOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]{1,5})?/))
    throw new GradleException('tenant.properties: apiOrigin must be a bare HTTPS origin (no path or trailing slash).')
if (!(cloudProjectNumber ==~ /[0-9]+/))
    throw new GradleException('tenant.properties: cloudProjectNumber must contain digits only.')
if (!(brandColor ==~ /#[0-9A-Fa-f]{6}/))
    throw new GradleException('tenant.properties: brandColor must be #RRGGBB.')
if (!(cornerRadius ==~ /[0-9]+/) || cornerRadius.toInteger() > 48)
    throw new GradleException('tenant.properties: cornerRadiusDp must be 0-48.')
if (!(versionCodeValue ==~ /[1-9][0-9]*/) || versionCodeValue.toLong() > 2100000000L)
    throw new GradleException('tenant.properties: versionCode must be a positive integer.')
if (!(versionNameValue ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,39}/))
    throw new GradleException('tenant.properties: versionName must be 1-40 letters, digits, dots, underscores or hyphens.')
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def uploadStore = System.getenv('ROOIAM_ANDROID_KEYSTORE_PATH')

def logo = null
if (logoName) {
    logo = file(logoName)
    if (!logo.canonicalPath.startsWith(projectDir.canonicalPath + File.separator) ||
        !logo.isFile() || !logo.name.toLowerCase().endsWith('.png'))
        throw new GradleException('tenant.properties: logoFile must be an existing PNG inside this project.')
}

android {
    namespace 'com.rooiam.tenantstarter'
    compileSdk 36
    defaultConfig {
        applicationId appId
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue.toInteger()
        versionName versionNameValue
        resValue 'string', 'app_name', appName
        manifestPlaceholders = [appIcon: logo ? '@drawable/tenant_logo' : '@drawable/starter_icon']
        buildConfigField 'String', 'API_ORIGIN', '"' + apiOrigin + '"'
        buildConfigField 'String', 'CLOUD_PROJECT_NUMBER', '"' + cloudProjectNumber + '"'
        buildConfigField 'String', 'BRAND_COLOR', '"' + brandColor + '"'
        buildConfigField 'int', 'CORNER_RADIUS_DP', cornerRadius
        buildConfigField 'String', 'LOGO_RESOURCE', '"' + (logo ? 'tenant_logo' : 'starter_icon') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/tenantBrandRes'))
    if (uploadStore) {
        ['ROOIAM_ANDROID_STORE_PASSWORD', 'ROOIAM_ANDROID_KEY_ALIAS', 'ROOIAM_ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing release signing environment variable: ${it}")
        }
        signingConfigs {
            playUpload {
                storeFile file(uploadStore)
                storePassword System.getenv('ROOIAM_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ROOIAM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ROOIAM_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.playUpload } }
    }
}

if (releaseRequested && (appId == 'com.example.phoneapp' || apiOrigin == 'https://auth.example.com' || cloudProjectNumber == '0'))
    throw new GradleException('Set your real applicationId, apiOrigin and cloudProjectNumber before a release build.')
if (releaseRequested && !uploadStore)
    throw new GradleException('Set ROOIAM_ANDROID_KEYSTORE_PATH and the three upload-key variables before a release build.')

tasks.register('generateTenantLogo', Sync) {
    if (logo) {
        from logo
        rename { 'tenant_logo.png' }
    }
    into layout.buildDirectory.dir('generated/tenantBrandRes/drawable-nodpi')
}
tasks.named('preBuild') { dependsOn 'generateTenantLogo' }

dependencies {
    implementation project(':sdk')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.android.play:integrity:1.3.0'
}
