name: Experimental iOS SDK compile
on:
  push:
    paths:
      - 'rooiam-sdk/ios/**'
      - '.github/workflows/ios-experimental.yml'
  pull_request:
    paths:
      - 'rooiam-sdk/ios/**'
      - '.github/workflows/ios-experimental.yml'
  workflow_dispatch:
jobs:
  ios-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Compile iOS SDK for simulator
        working-directory: rooiam-sdk/ios
        run: xcodebuild -scheme RooiamPhoneSDK -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test protocol vectors on iOS simulator
        working-directory: rooiam-sdk/ios
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for group in data["devices"].values() for device in group if device["name"].startswith("iPhone") and device["state"] == "Shutdown"))')
          xcodebuild -scheme RooiamPhoneSDK -destination "platform=iOS Simulator,id=${simulator_id}" CODE_SIGNING_ALLOWED=NO test
