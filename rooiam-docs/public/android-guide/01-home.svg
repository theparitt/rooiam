<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-label="Illustrated reference app home screen"><rect x="0" y="0" width="520" height="780" rx="0" fill="#f7f3ff" stroke="none" stroke-width="1"/><rect x="38" y="14" width="444" height="740" rx="37" fill="#20243a" stroke="none" stroke-width="1"/><rect x="49" y="25" width="422" height="718" rx="28" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="203" y="34" width="114" height="15" rx="8" fill="#20243a" stroke="none" stroke-width="1"/><text x="70" y="87" fill="#2d2343" font-size="21" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Rooiam Reference</text><rect x="69" y="105" width="382" height="1" rx="0" fill="#e8e3f3" stroke="none" stroke-width="1"/><text x="69" y="137" fill="#2d2343" font-size="26" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Scan. Match. Approve.</text><text x="69" y="174" fill="#666178" font-size="15" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Enroll your phone with the server you trust.</text><text x="69" y="198" fill="#666178" font-size="15" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Only approve sign-ins you started.</text><rect x="69" y="224" width="382" height="57" rx="11" fill="#faf9ff" stroke="#d8d0eb" stroke-width="1"/><text x="84" y="260" fill="#293042" font-size="16" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">https://auth.example.com</text><rect x="69" y="297" width="382" height="57" rx="11" fill="#faf9ff" stroke="#d8d0eb" stroke-width="1"/><text x="84" y="333" fill="#777189" font-size="15" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Google Cloud project number</text><rect x="69" y="373" width="382" height="50" rx="14" fill="#eee9ff" stroke="none" stroke-width="1"/><text x="87" y="405" fill="#5734ae" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">1. SIGN IN TO ROOIAM</text><rect x="69" y="438" width="382" height="50" rx="14" fill="#eee9ff" stroke="none" stroke-width="1"/><text x="87" y="470" fill="#5734ae" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2. ENROLL THIS PHONE</text><rect x="69" y="503" width="382" height="50" rx="14" fill="#eee9ff" stroke="none" stroke-width="1"/><text x="87" y="535" fill="#5734ae" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">3. SCAN A SIGN-IN QR</text><rect x="69" y="568" width="382" height="50" rx="14" fill="#faf9ff" stroke="none" stroke-width="1"/><text x="87" y="600" fill="#5734ae" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">PASTE QR TEXT</text><rect x="69" y="633" width="382" height="50" rx="14" fill="#faf9ff" stroke="none" stroke-width="1"/><text x="87" y="665" fill="#5734ae" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">REVOKE THIS PHONE</text><rect x="131" y="762" width="258" height="1" rx="0" fill="#c8bfdc" stroke="none" stroke-width="1"/><text x="260" y="773" fill="#82779c" font-size="11" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Illustration • example values</text></svg>